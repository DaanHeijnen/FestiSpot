<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#19101c" />
  <title>FestiSpot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    :root{--bg:#19101c;--surface:#261c28;--surface2:#302733;--surface3:#3c313e;--text:#eeddee;--muted:#d4c0d7;--primary:#ecb2ff;--purple:#bd00ff;--cyan:#00dbe9;--outline:#514255;--danger:#ffb4ab;--safe-bottom:env(safe-area-inset-bottom,24px)}
    *{box-sizing:border-box} html,body,#app{height:100%;margin:0} body{font-family:Lexend,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;width:100vw;-webkit-tap-highlight-color:transparent} button,input,select{font:inherit} button{border:0;color:inherit} .screen{height:100dvh;width:100vw;overflow:hidden;background:radial-gradient(circle at 50% 0%,rgba(189,0,255,.22),transparent 38%),radial-gradient(circle at 20% 95%,rgba(0,219,233,.14),transparent 30%),var(--bg)} .scroll{overflow:auto;height:100%;padding:84px 16px calc(92px + var(--safe-bottom))}.glass{background:rgba(38,28,40,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(236,178,255,.12);box-shadow:0 16px 40px rgba(0,0,0,.25)} .card{border-radius:28px;padding:18px}.muted{color:var(--muted)} .btn{min-height:52px;border-radius:999px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;cursor:pointer;transition:.14s transform,.14s opacity;background:var(--surface3)} .btn:active{transform:scale(.97)} .btn.primary{background:linear-gradient(135deg,var(--primary),var(--purple));color:#320047;box-shadow:0 0 28px rgba(236,178,255,.2)} .btn.secondary{background:rgba(0,219,233,.14);color:#d3fbff;border:1px solid rgba(0,219,233,.22)} .btn.ghost{background:rgba(238,221,238,.08)} .btn.danger{background:rgba(255,180,171,.14);color:var(--danger)} .btn:disabled{opacity:.45}.full{width:100%}.row{display:flex;align-items:center;gap:12px}.between{display:flex;align-items:center;justify-content:space-between;gap:12px}.icon{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1}.appbar{position:fixed;z-index:500;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,rgba(25,16,28,.92),rgba(25,16,28,.55),transparent)} .brand{font-size:20px;font-weight:900;letter-spacing:-.03em}.bottom-nav{position:fixed;z-index:510;left:12px;right:12px;bottom:calc(10px + var(--safe-bottom));height:68px;border-radius:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));padding:8px}.navbtn{border-radius:22px;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700}.navbtn.active{background:rgba(236,178,255,.15);color:var(--primary)} .mapwrap{height:100%;padding:72px 0 132px}.map{height:100%;width:100%;background:#130b16}.map-cta{position:fixed;z-index:520;left:16px;right:16px;bottom:calc(92px + var(--safe-bottom));display:flex;gap:10px}.pin{width:50px;height:50px;border-radius:50%;border:3px solid var(--primary);box-shadow:0 0 20px rgba(236,178,255,.38);object-fit:cover;background:var(--surface3)} .pin.moving{border-color:var(--cyan);box-shadow:0 0 18px rgba(0,219,233,.28);opacity:.58;filter:saturate(.75)} .pin,.avatar{aspect-ratio:1/1;object-fit:cover;overflow:hidden;clip-path:circle(50% at 50% 50%);flex:0 0 auto}.pin-label{background:rgba(25,16,28,.88);border:1px solid rgba(236,178,255,.18);color:var(--text);border-radius:999px;padding:3px 8px;font-size:11px;text-align:center;margin-top:2px}.leaflet-div-icon{background:transparent;border:0}.popup{min-width:210px;color:var(--text)} .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:rgba(38,28,40,.96);color:var(--text);border:1px solid rgba(236,178,255,.14);box-shadow:0 16px 40px rgba(0,0,0,.35);border-radius:20px}.leaflet-container a{color:var(--primary)} .pass{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;gap:24px;text-align:center}.radar{width:116px;height:116px;border-radius:999px;border:1px solid rgba(236,178,255,.25);display:grid;place-items:center;position:relative;box-shadow:0 0 40px rgba(189,0,255,.24)} .radar:before{content:"";position:absolute;inset:14px;border-radius:999px;border:1px solid rgba(0,219,233,.22)} .radar .icon{font-size:54px;color:var(--primary)} .dots{display:flex;gap:14px}.dot{width:17px;height:17px;border-radius:999px;border:2px solid var(--primary);opacity:.6}.dot.on{background:var(--primary);opacity:1;box-shadow:0 0 16px rgba(236,178,255,.5)} .keypad{display:grid;grid-template-columns:repeat(3,74px);gap:12px;justify-content:center}.key{height:64px;border-radius:24px;background:rgba(238,221,238,.09);font-size:24px;font-weight:800}.shake{animation:shake .34s}@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}} .input{width:100%;height:54px;border-radius:20px;background:rgba(238,221,238,.08);border:1px solid rgba(236,178,255,.14);color:var(--text);padding:0 16px;outline:none} .avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--surface3);border:2px solid rgba(236,178,255,.25)} .avatar.big{width:112px;height:112px}.list{display:flex;flex-direction:column;gap:12px}.sheet{position:fixed;z-index:800;left:0;right:0;bottom:0;padding:12px 14px calc(14px + var(--safe-bottom));border-radius:30px 30px 0 0;background:rgba(38,28,40,.96);border:1px solid rgba(236,178,255,.14);box-shadow:0 -22px 60px rgba(0,0,0,.5);max-height:86dvh;overflow:auto}.backdrop{position:fixed;inset:0;z-index:790;background:rgba(0,0,0,.45)} .option{padding:14px;border-radius:22px;background:rgba(238,221,238,.06);border:1px solid rgba(236,178,255,.1);margin:10px 0}.toast{position:fixed;z-index:900;left:16px;right:16px;top:calc(66px + env(safe-area-inset-top,0px));border-radius:20px;padding:14px 16px;background:rgba(48,39,51,.96);border:1px solid rgba(236,178,255,.14)} .find-panel{position:fixed;z-index:700;left:12px;right:12px;bottom:calc(10px + var(--safe-bottom));border-radius:28px;padding:12px}.finding{height:100dvh;padding:calc(72px + env(safe-area-inset-top,0px)) 16px calc(24px + var(--safe-bottom));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.compass-ring{width:min(78vw,330px);height:min(78vw,330px);border-radius:50%;display:grid;place-items:center;position:relative;border:1px solid rgba(236,178,255,.22);background:radial-gradient(circle,rgba(236,178,255,.16),rgba(0,219,233,.08),rgba(38,28,40,.82));box-shadow:0 0 70px rgba(189,0,255,.22)}.compass-arrow{font-size:120px;color:var(--primary);filter:drop-shadow(0 0 22px rgba(236,178,255,.65));transition:transform .3s ease}.compass-label{position:absolute;bottom:28px;left:20px;right:20px;font-weight:900}.loading-screen{height:100dvh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}.spinner{width:66px;height:66px;border-radius:50%;border:4px solid rgba(238,221,238,.14);border-top-color:var(--primary);animation:spin .9s linear infinite;margin:0 auto 22px}@keyframes spin{to{transform:rotate(360deg)}}.light{height:100dvh;background:#050406;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px}.light>div{width:100%}.neon{font-size:clamp(76px,20vw,180px);line-height:.96;font-weight:900;background:linear-gradient(90deg,#ecb2ff,#00dbe9,#f9e534,#ecb2ff);background-size:300% 300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rgb 2.4s linear infinite;text-shadow:0 0 28px rgba(236,178,255,.25)}@keyframes rgb{0%{background-position:0 50%}100%{background-position:300% 50%}} .stage-img{width:100%;height:260px;border-radius:24px;background:var(--surface3);object-fit:cover;border:1px solid rgba(236,178,255,.14)} .stage-box{position:relative}.stage-pin{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--primary);box-shadow:0 0 22px var(--primary);transform:translate(-50%,-50%)} .hidden{display:none!important} h1,h2,h3,p{margin-top:0} h1{font-size:32px;line-height:1.04;letter-spacing:-.04em} h2{font-size:24px;letter-spacing:-.03em}.small{font-size:12px}.spacer{height:12px}@media(min-width:720px){body:before{content:'FestiSpot is gemaakt voor mobiel. Verklein je browser of open op je telefoon.';position:fixed;inset:0;display:grid;place-items:center;padding:40px;text-align:center;background:var(--bg);z-index:9999;font-size:22px}.screen{display:none}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
  const $ = (sel, root=document) => root.querySelector(sel);
  const app = $('#app');
  const fallbackPhoto = 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" rx="100" fill="#302733"/><circle cx="100" cy="80" r="38" fill="#ecb2ff"/><path d="M38 178c12-39 42-60 62-60s50 21 62 60" fill="#00dbe9" opacity=".8"/></svg>`);
  const stages = [{id:'alpha',name:'Alpha',mapImageUrl:'/stage-maps/alpha.svg'},{id:'bravo',name:'Bravo',mapImageUrl:'/stage-maps/bravo.svg'},{id:'charlie',name:'Charlie',mapImageUrl:'/stage-maps/charlie.svg'}];
  const ownVisibleMessages = ['Je spot is gedeeld.','Je hebt een spot gevonden.','Je vrienden kunnen je spot vinden.','Je bent terug op de kaart.','Spot bijgewerkt.','Hier blijf je even hangen.'];
  const ownMovingMessages = ['Je bent onderweg. Je laatst gedeelde spot blijft zichtbaar, maar is minder zeker.','Je loopt rond. Je laatste spot blijft zichtbaar als oude plek.','Je bent weg van deze spot. Anderen zien dat je onderweg bent.'];
  const ownHiddenMessages = ['Je bent van de kaart.','Tijd voor een geheime missie.','Niemand ziet waar je bent.','Je bent even spoorloos.'];
  const DEFAULT_SESSION_ID = '11111111-1111-4111-8111-111111111111';
  const state = { sessionId: DEFAULT_SESSION_ID, token: localStorage.fs_token || '', role: localStorage.fs_role || 'user', user: JSON.parse(localStorage.fs_user || 'null'), tab: localStorage.fs_role === 'admin' ? 'admin' : 'map', users: [], signals: [], selected: null, selectedId: null, findView: 'compass', watchId: null, compassHeading: 0, map: null, markers: [], sheet: null, stageMarker: null, locationPhotoUrl: null, previousDistance: null, ownLocation: null, light: null, isJoining: false };
  const api = async (path, options={}) => { const res = await fetch('/.netlify/functions/' + path, { ...options, headers: { 'content-type': 'application/json', ...(state.token ? { authorization:'Bearer '+state.token } : {}), ...(options.headers||{}) }}); const data = await res.json().catch(()=>({ok:false,error:'Geen JSON'})); if(!res.ok || data.ok===false) throw new Error(data.error || 'Er ging iets mis'); return data; };
  function toast(text){ const node=document.createElement('div'); node.className='toast'; node.textContent=text; document.body.appendChild(node); setTimeout(()=>node.remove(),3200); }
  function icon(name){ return `<span class="icon">${name}</span>`; }
  function vibrate(ms=18){ if(navigator.vibrate) navigator.vibrate(ms); }
  function esc(s){ return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
  function relTime(value){ if(!value) return 'onbekend'; const m=Math.max(0,Math.floor((Date.now()-new Date(value).getTime())/60000)); if(m<1)return'net'; if(m===1)return'1 min geleden'; if(m<60)return m+' min geleden'; return Math.floor(m/60)+' uur geleden'; }
  function statusText(u){ const status=u.locationStatus||'hidden'; if(status==='hidden') return `${u.name} is van de kaart`; if(status==='moving') return `${u.name} is onderweg, laatste spot is minder zeker`; const loc=u.location; if(loc && Date.now()-new Date(loc.updatedAt).getTime()>5*60000) return `${u.name} was hier net nog`; return `${u.name} heeft een spot gevonden`; }
  function getDistanceInMeters(from,to){ const R=6371000,dLat=((to.latitude-from.latitude)*Math.PI)/180,dLon=((to.longitude-from.longitude)*Math.PI)/180,lat1=(from.latitude*Math.PI)/180,lat2=(to.latitude*Math.PI)/180; const a=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2; return Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))); }
  function proximity(current, prev, lastUpdatedAt, name){ const age=Math.floor((Date.now()-new Date(lastUpdatedAt).getTime())/60000); if(age>=5) return {label:`${name} was hier net nog`, sub:`${age} min geleden`, arrow:'schedule'}; if(current<=20) return {label:'Heel dichtbij', sub:'Kijk om je heen', arrow:'near_me'}; if(prev==null) return {label:`Ongeveer ${current} meter`, sub:'Loop rustig die kant op', arrow:'explore'}; const delta=prev-current; if(delta>10) return {label:'Warmer', sub:`Ongeveer ${current} meter`, arrow:'trending_up'}; if(delta<-10) return {label:'Kouder', sub:`Ongeveer ${current} meter`, arrow:'trending_down'}; return {label:`Ongeveer ${current} meter`, sub:'Blijf in beweging', arrow:'explore'}; }
  function fileToDataUrl(file){ return new Promise((resolve,reject)=>{ const reader=new FileReader(); reader.onload=()=>resolve(reader.result); reader.onerror=()=>reject(reader.error); reader.readAsDataURL(file); }); }
  async function compressImage(file, maxSize=900, quality=.76){ if(!file || !file.type?.startsWith('image/')) return file; try{ const bitmap=await createImageBitmap(file,{imageOrientation:'from-image'}); const scale=Math.min(1,maxSize/Math.max(bitmap.width,bitmap.height)); const canvas=document.createElement('canvas'); canvas.width=Math.max(1,Math.round(bitmap.width*scale)); canvas.height=Math.max(1,Math.round(bitmap.height*scale)); const ctx=canvas.getContext('2d'); ctx.drawImage(bitmap,0,0,canvas.width,canvas.height); const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',quality)); if(!blob) return file; return new File([blob],(file.name||'photo')+'.jpg',{type:'image/jpeg'}); }catch(e){ return file; } }
  async function uploadImage(file, folder){ if(!file) return null; try{ const smaller=await compressImage(file); const dataUrl=await fileToDataUrl(smaller); const res=await api('upload-image',{method:'POST',body:JSON.stringify({folder,contentType:smaller.type||'image/jpeg',data:dataUrl})}); return res.url; }catch(e){ toast('Upload mislukt, tijdelijke marker gebruikt.'); return null; } }
  function showJoinLoading(){ layout(`<section class="loading-screen"><div class="card glass"><div class="spinner"></div><h1>We geven jou een spot in de groep :)</h1><p class="muted">Je foto wordt kleiner gemaakt en je profiel wordt aangemaakt.</p></div></section>`,{appbar:false,nav:false}); }
  function getSelectedUser(){ return state.users.find(u=>u.id===(state.selectedId || state.selected?.id)); }
  function getBearing(from,to){ const lat1=from.latitude*Math.PI/180, lat2=to.latitude*Math.PI/180, dLon=(to.longitude-from.longitude)*Math.PI/180; const y=Math.sin(dLon)*Math.cos(lat2); const x=Math.cos(lat1)*Math.sin(lat2)-Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon); return (Math.atan2(y,x)*180/Math.PI+360)%360; }
  function startCompassWatch(){ if(state.watchId) navigator.geolocation.clearWatch(state.watchId); state.watchId=navigator.geolocation.watchPosition(pos=>{ state.ownLocation={latitude:pos.coords.latitude,longitude:pos.coords.longitude}; if(state.selectedId && state.findView==='compass') renderFind(); },()=>{}, {enableHighAccuracy:true,maximumAge:2000,timeout:12000}); if(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission==='function'){ DeviceOrientationEvent.requestPermission().catch(()=>{}); } window.ondeviceorientationabsolute=window.ondeviceorientation=(e)=>{ const h=typeof e.webkitCompassHeading==='number'?e.webkitCompassHeading:(360-(e.alpha||0)); state.compassHeading=h||0; const arrow=$('.compass-arrow'); if(arrow && state.ownLocation){ const u=getSelectedUser(); if(u?.location){ arrow.style.transform=`rotate(${Math.round(getBearing(state.ownLocation,u.location)-state.compassHeading)}deg)`; } } }; }
  function stopCompassWatch(){ if(state.watchId){ navigator.geolocation.clearWatch(state.watchId); state.watchId=null; } window.ondeviceorientation=null; window.ondeviceorientationabsolute=null; }
  function layout(content, opts={}){ app.innerHTML=`<main class="screen">${opts.appbar!==false?`<div class="appbar"><div class="brand">FestiSpot</div><button class="btn ghost" id="refreshBtn">${icon('radar')}</button></div>`:''}${content}${opts.nav!==false?nav():''}</main>`; $('#refreshBtn')?.addEventListener('click',()=>loadState(true)); bindNav(); }
  function nav(){ if(state.role==='admin') return `<nav class="bottom-nav glass"><button class="navbtn active" data-tab="admin">${icon('admin_panel_settings')}Admin</button></nav>`; return `<nav class="bottom-nav glass"><button class="navbtn ${state.tab==='map'?'active':''}" data-tab="map">${icon('map')}Kaart</button><button class="navbtn ${state.tab==='people'?'active':''}" data-tab="people">${icon('groups')}Mensen</button><button class="navbtn ${state.tab==='profile'?'active':''}" data-tab="profile">${icon('person')}Profiel</button></nav>`; }
  function bindNav(){ document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab; render();}); }
  function render(){ if(!state.token) return passcode(); if(state.role==='admin'){ state.tab='admin'; return adminScreen(); } if(!state.user) return profileSetup(); if(state.light) return lightMode(); if(state.selectedId) return renderFind(); if(state.tab==='people') return peopleScreen(); if(state.tab==='profile') return profileScreen(); return mapScreen(); }
  function passcode(){ let code='', bad=false; layout(`<section class="pass ${bad?'shake':''}"><div class="radar">${icon('radar')}</div><div><h1>Voer de code in</h1><p class="muted">Gebruik de groepscode om FestiSpot te openen.</p><p class="muted small">Vraag de code aan je groep.</p></div><div class="dots">${[0,1,2,3].map(i=>`<span class="dot ${i<code.length?'on':''}"></span>`).join('')}</div><p id="err" class="muted small"></p><div class="keypad">${[1,2,3,4,5,6,7,8,9,'help',0,'back'].map(k=>`<button class="key" data-key="${k}">${k==='back'?icon('backspace'):k==='help'?'Help':k}</button>`).join('')}</div></section>`,{appbar:false,nav:false}); const redraw=()=>{document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i<code.length));}; document.querySelectorAll('[data-key]').forEach(b=>b.onclick=async()=>{ const k=b.dataset.key; vibrate(); if(k==='help'){toast('Vraag de code aan je groep.');return} if(k==='back'){code=code.slice(0,-1);redraw();return} if(code.length<4) code+=k; redraw(); if(code.length===4){ try{ const data=await api('validate-passcode',{method:'POST',body:JSON.stringify({passcode:code})}); state.token=data.sessionToken; state.role=data.role || 'user'; state.tab=state.role==='admin'?'admin':'map'; localStorage.fs_token=state.token; localStorage.fs_role=state.role; localStorage.removeItem('fs_sessionId'); if(state.role==='admin') localStorage.removeItem('fs_user'); await loadState(); render(); }catch(e){ code=''; redraw(); $('#err').textContent=e.message && e.message.includes('Login service error') ? e.message : 'Oeps, deze code klopt niet.'; $('.pass').classList.add('shake'); vibrate(80); setTimeout(()=>$('.pass')?.classList.remove('shake'),380); } } }); }
  function profileSetup(){ layout(`<div class="scroll"><div class="card glass"><h1>Wie ben jij?</h1><p class="muted">Kies je naam en upload een foto, zodat je vrienden je herkennen.</p><div class="row" style="margin:20px 0"><img id="preview" class="avatar big" src="${fallbackPhoto}"><div><input id="photo" type="file" accept="image/*" capture="user" hidden><button class="btn secondary" id="photoBtn">${icon('photo_camera')}Maak snel een foto</button><div class="spacer"></div><button class="btn ghost" id="uploadBtn">Upload je festivalhoofd</button></div></div><input class="input" id="name" placeholder="Je naam"><p class="muted small">Geen foto? Dan maken we een tijdelijke marker.</p><button class="btn primary full" id="join">Ik doe mee</button></div></div>`,{nav:false}); let file=null; $('#photoBtn').onclick=()=>$('#photo').click(); $('#uploadBtn').onclick=()=>$('#photo').click(); $('#photo').onchange=e=>{file=e.target.files[0]; if(file) $('#preview').src=URL.createObjectURL(file);}; $('#join').onclick=async()=>{ if(state.isJoining) return; try{ const name=$('#name').value.trim(); if(!name) return toast('Vul eerst je naam in.'); state.isJoining=true; $('#join').disabled=true; showJoinLoading(); const url=await uploadImage(file,'profiles') || fallbackPhoto; const data=await api('create-user',{method:'POST',body:JSON.stringify({name,profilePhotoUrl:url})}); state.user={id:data.user.id,name:data.user.name,profilePhotoUrl:data.user.profile_photo_url||url}; localStorage.fs_user=JSON.stringify(state.user); await loadState(); state.isJoining=false; render(); }catch(e){ state.isJoining=false; toast(e.message); profileSetup(); } }; }
  async function loadState(silent=false){ if(!state.token) return; try{ const userQuery=state.user?.id ? ('?userId='+encodeURIComponent(state.user.id)) : ''; const data=await api('get-session-state'+userQuery); state.users=data.users||[]; state.signals=data.signals||[]; if(state.user?.id){ const me=state.users.find(u=>u.id===state.user.id); if(me) state.user={...state.user,name:me.name,profilePhotoUrl:me.profilePhotoUrl,locationStatus:me.locationStatus,isVisible:me.isVisible}; localStorage.fs_user=JSON.stringify(state.user); } if(!silent) return; toast('Plekken bijgewerkt.'); }catch(e){ if(!silent) console.error(e); else toast(e.message); } }
  function mapScreen(){ const me=state.users.find(u=>state.user&&u.id===state.user.id)||state.user||{}; const isLocked=me.locationStatus==='locked'; const cta=isLocked?`<button class="btn secondary full" id="moving">${icon('directions_walk')}Ik ga lopen</button>`:`<button class="btn primary full" id="share">${icon('location_on')}Deel mijn spot</button>`; layout(`<div class="mapwrap"><div id="map" class="map"></div></div><div class="map-cta">${cta}</div>`); setTimeout(initMap,0); const share=$('#share'); if(share) share.onclick=()=>openShareSheet(); const moving=$('#moving'); if(moving) moving.onclick=()=>setStatus('moving'); if(state.signals[0]) showSignal(state.signals[0]); }
  function initMap(){ const locUsers=state.users.filter(u=>u.location && (u.locationStatus==='locked'||u.locationStatus==='moving'||u.isVisible)); const center=locUsers[0]?.location || {latitude:51.849,longitude:5.814}; state.map=L.map('map',{zoomControl:false,maxZoom:22}).setView([center.latitude,center.longitude],19); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OSM',maxZoom:22,maxNativeZoom:19}).addTo(state.map); const bounds=[]; locUsers.forEach(u=>{ const cls=u.locationStatus==='moving'?'moving':''; const html=`<div><img class="pin ${cls}" src="${esc(u.profilePhotoUrl||fallbackPhoto)}"><div class="pin-label">${esc(u.name)}</div></div>`; const marker=L.marker([u.location.latitude,u.location.longitude],{icon:L.divIcon({html,iconSize:[70,74],iconAnchor:[35,50]})}).addTo(state.map); bounds.push([u.location.latitude,u.location.longitude]); const btnId='find_'+u.id.replace(/-/g,''); marker.bindPopup(`<div class="popup"><b>${esc(statusText(u))}</b><p class="muted small">Laatst gezien: ${esc(relTime(u.location.updatedAt))}</p>${u.locationStatus==='moving'?'<p class="muted small" style="color:#ffdd99">Let op: deze spot is minder betrouwbaar. Deze persoon is onderweg.</p>':''}${u.id!==state.user.id?`<button class="btn secondary full" id="${btnId}">Zoek ${esc(u.name)}</button>`:''}</div>`); marker.on('popupopen',()=>{const b=document.getElementById(btnId); if(b)b.onclick=()=>startFind(u.id);}); }); if(bounds.length>1){ state.map.fitBounds(bounds,{padding:[54,54],maxZoom:19}); } else if(bounds.length===1){ state.map.setView(bounds[0],20); } }
  function peopleScreen(){ const cards=state.users.map(u=>{ const findable=!!u.location && (u.locationStatus==='locked'||u.locationStatus==='moving'||u.isVisible); const movingNote=u.locationStatus==='moving'?`<p class="muted small" style="margin:4px 0 0;color:#ffdd99">Laatste spot is minder betrouwbaar.</p>`:''; return `<div class="card glass between"><div class="row"><img class="avatar" style="opacity:${u.locationStatus==='hidden'?'.55':'1'}" src="${esc(u.profilePhotoUrl||fallbackPhoto)}"><div><b>${esc(u.name)}</b><p class="muted small" style="margin:4px 0 0">${esc(statusText(u))}</p>${u.location?`<p class="muted small" style="margin:4px 0 0">Laatst gezien: ${esc(relTime(u.location.updatedAt))}</p>${movingNote}`:`<p class="muted small" style="margin:4px 0 0">Misschien op geheime missie</p>`}</div></div>${state.user&&u.id!==state.user.id&&findable?`<button class="btn secondary" data-find="${u.id}">Zoek</button>`:`<button class="btn ghost" disabled>${findable?'Jij':'Niet vindbaar'}</button>`}</div>` }).join(''); layout(`<div class="scroll"><h1>Mensen</h1><p class="muted">Zie wie een spot heeft gevonden of onderweg is.</p><div class="list">${cards||'<p class="muted">Nog niemand met een spot.</p>'}</div></div>`); document.querySelectorAll('[data-find]').forEach(b=>b.onclick=()=>startFind(b.dataset.find)); }
    function profileScreen(){ const me=state.users.find(u=>u.id===state.user.id)||state.user; const isLocked=me.locationStatus==='locked'; const primary=isLocked?`<button class="btn secondary full" id="moving2">${icon('directions_walk')}Ik ga lopen</button>`:`<button class="btn primary full" id="share2">${icon('location_on')}Deel mijn spot</button>`; layout(`<div class="scroll"><div class="card glass"><div class="row"><img class="avatar big" src="${esc(me.profilePhotoUrl||fallbackPhoto)}"><div><h2>${esc(me.name)}</h2><p class="muted">${esc(statusText(me))}</p>${me.locationStatus==='moving'?'<p class="muted small" style="color:#ffdd99">Je laatste spot blijft zichtbaar, maar anderen zien dat je onderweg bent.</p>':''}</div></div><div class="spacer"></div>${primary}<div class="spacer"></div><button class="btn danger full" id="hide">${icon('visibility_off')}Verberg mij helemaal</button><div class="spacer"></div><button class="btn ghost full" id="leave">Sessie verlaten</button></div></div>`); const share=$('#share2'); if(share) share.onclick=()=>openShareSheet(); const moving=$('#moving2'); if(moving) moving.onclick=()=>setStatus('moving'); $('#hide').onclick=()=>setStatus('hidden'); $('#leave').onclick=()=>{ const savedUser=localStorage.fs_user; localStorage.removeItem('fs_token'); localStorage.removeItem('fs_role'); if(savedUser) localStorage.fs_user=savedUser; state.token=''; state.role='user'; state.tab='map'; render(); }; }
    function openShareSheet(){ document.body.insertAdjacentHTML('beforeend',`<div class="backdrop"></div><div class="sheet"><h2>Deel mijn spot</h2><p class="muted">Deel de plek waar je even blijft, zodat vrienden je kunnen vinden.</p><div class="option"><b>Mijn huidige spot</b><p class="muted small">We gebruiken je telefoonlocatie.</p></div><input id="locPhoto" type="file" accept="image/*" capture="environment" hidden><button class="option full" id="photoLoc"><div class="row">${icon('photo_camera')}<div><b>Foto toevoegen</b><p class="muted small">Maak een snelle foto van waar je staat.</p></div></div></button><button class="option full" id="stageOpen"><div class="row">${icon('map')}<div><b>Marker op plattegrond zetten</b><p class="muted small">Handig als GPS niet precies genoeg is.</p></div></div></button><div class="row"><button class="btn ghost full" id="cancelSheet">Toch niet</button><button class="btn primary full" id="submitShare">Deel mijn spot</button></div></div>`); const close=()=>{$('.backdrop')?.remove();$('.sheet')?.remove();}; $('.backdrop').onclick=close; $('#cancelSheet').onclick=close; $('#photoLoc').onclick=()=>$('#locPhoto').click(); $('#locPhoto').onchange=e=>{state.locationPhotoFile=e.target.files[0]; toast('Foto toegevoegd.');}; $('#stageOpen').onclick=()=>openStageSheet(); $('#submitShare').onclick=async()=>{ try{ $('#submitShare').disabled=true; const pos=await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,timeout:12000,maximumAge:15000})); const photo=await uploadImage(state.locationPhotoFile,'locations'); await api('update-location',{method:'POST',body:JSON.stringify({userId:state.user.id,latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy||null,locationPhotoUrl:photo,stageMarker:state.stageMarker})}); close(); state.stageMarker=null; state.locationPhotoFile=null; await loadState(); toast(ownVisibleMessages[Math.floor(Math.random()*ownVisibleMessages.length)]); render(); }catch(e){ toast(e.message||'Locatie delen lukt niet.'); $('#submitShare').disabled=false; } }; }
  function openStageSheet(){ const sheet=$('.sheet'); sheet.innerHTML=`<h2>Marker op plattegrond zetten</h2><label class="muted small">Kies podium</label><select class="input" id="stageSel"><option value="">Selecteer een podium</option>${stages.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select><p class="muted">Tik op de plattegrond waar je staat.</p><div class="stage-box"><img id="stageImg" class="stage-img" src="/stage-maps/alpha.svg"><span id="stagePin" class="stage-pin hidden"></span></div><div class="row" style="margin-top:12px"><button class="btn ghost full" id="backShare">Toch niet</button><button class="btn primary full" id="confirmStage" disabled>Hier sta ik</button></div>`; let selected=null, x=null,y=null; $('#stageSel').onchange=e=>{selected=stages.find(s=>s.id===e.target.value); if(selected) $('#stageImg').src=selected.mapImageUrl;}; $('#stageImg').onclick=e=>{ const rect=e.target.getBoundingClientRect(); x=((e.clientX-rect.left)/rect.width)*100; y=((e.clientY-rect.top)/rect.height)*100; const p=$('#stagePin'); p.classList.remove('hidden'); p.style.left=x+'%'; p.style.top=y+'%'; $('#confirmStage').disabled=false; }; $('#backShare').onclick=()=>{$('.backdrop')?.remove();$('.sheet')?.remove();openShareSheet();}; $('#confirmStage').onclick=()=>{ if(!selected) return toast('Kies eerst een podium.'); state.stageMarker={stageId:selected.id,stageName:selected.name,mapImageUrl:selected.mapImageUrl,mapX:Math.round(x*10)/10,mapY:Math.round(y*10)/10}; $('.backdrop')?.remove();$('.sheet')?.remove();openShareSheet();toast('Plattegrond marker toegevoegd.');}; }
  async function setStatus(status){ try{ await api('set-visibility',{method:'POST',body:JSON.stringify({userId:state.user.id,locationStatus:status,isVisible:status!=='hidden'})}); await loadState(); toast((status==='moving'?ownMovingMessages:ownHiddenMessages)[Math.floor(Math.random()*(status==='moving'?ownMovingMessages:ownHiddenMessages).length)]); render(); }catch(e){toast(e.message)} }
  function startFind(id){ state.selectedId=id; state.selected=state.users.find(u=>u.id===id); state.findView='compass'; state.previousDistance=null; startCompassWatch(); navigator.geolocation.getCurrentPosition(pos=>{ state.ownLocation={latitude:pos.coords.latitude,longitude:pos.coords.longitude}; renderFind(); },()=>{state.ownLocation=null; renderFind();},{enableHighAccuracy:true,timeout:10000}); }
  function renderFind(){ const u=getSelectedUser(); if(!u){ state.selectedId=null; state.selected=null; stopCompassWatch(); return render(); } state.selected=u; if(state.findView==='map'){ mapScreen(); document.querySelector('.bottom-nav')?.remove(); const dist=state.ownLocation&&u.location?getDistanceInMeters(state.ownLocation,u.location):null; document.body.insertAdjacentHTML('beforeend',`<div class="find-panel glass"><div class="between"><div><b>Je zoekt ${esc(u.name)}</b><p class="muted small" style="margin:4px 0 0">${dist==null?'Afstand onbekend':'Ongeveer '+dist+' meter'}</p></div><button class="btn secondary" id="compassMode">Kompas</button></div><div class="row" style="margin-top:10px"><button class="btn secondary full" id="imhere">Ik ben hier</button><button class="btn ghost full" id="lightme">Licht mij op</button><button class="btn danger" id="stopfind">Stop</button></div></div>`); bindFindButtons(u); $('#compassMode').onclick=()=>{state.findView='compass';renderFind();}; return; } const dist=state.ownLocation&&u.location?getDistanceInMeters(state.ownLocation,u.location):null; const prox=dist==null?{label:`Je zoekt ${u.name}`,sub:'Zet je locatie aan voor afstand'}:proximity(dist,state.previousDistance,u.location.updatedAt,u.name); if(dist!=null) state.previousDistance=dist; const angle=state.ownLocation&&u.location?Math.round(getBearing(state.ownLocation,u.location)-state.compassHeading):0; layout(`<section class="finding"><div class="row" style="position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:16px;right:16px;justify-content:space-between"><button class="btn ghost" id="mapMode">${icon('map')}Kaart</button><button class="btn danger" id="stopfindTop">Stop zoeken</button></div><img class="avatar big" src="${esc(u.profilePhotoUrl||fallbackPhoto)}"><h1>Je zoekt ${esc(u.name)}</h1><div class="compass-ring"><span class="icon compass-arrow" style="transform:rotate(${angle}deg)">navigation</span><div class="compass-label">${esc(prox.label)}</div></div><p class="muted" style="margin:18px 0 4px">${esc(prox.sub)}</p>${u.locationStatus==='moving'?'<p class="muted small" style="color:#ffdd99">Let op: deze persoon is onderweg. De spot is minder betrouwbaar.</p>':''}<div class="row" style="width:100%;margin-top:20px"><button class="btn secondary full" id="imhere">Ik ben hier</button><button class="btn ghost full" id="lightme">Licht mij op</button></div></section>`,{appbar:false,nav:false}); bindFindButtons(u); $('#mapMode').onclick=()=>{state.findView='map';renderFind();}; $('#stopfindTop').onclick=()=>stopFinding(); }
  function bindFindButtons(u){ $('#stopfind')?.addEventListener('click',stopFinding); $('#lightme')?.addEventListener('click',()=>{state.light={mode:'sender',name:u.name};render();}); $('#imhere')?.addEventListener('click',async()=>{ try{await api('create-signal',{method:'POST',body:JSON.stringify({fromUserId:state.user.id,toUserId:u.id,type:'im_here'})});toast(`${u.name} krijgt je signaal.`)}catch(e){toast(e.message)} }); }
  function stopFinding(){ state.selectedId=null; state.selected=null; state.previousDistance=null; state.findView='compass'; stopCompassWatch(); render(); }
  function lightMode(){ const sender=state.light.mode==='sender'; layout(`<section class="light"><div><div class="neon">${sender?`Ik zoek<br>${esc(state.light.name)}!?!`:`Ik ben<br>${esc(state.user.name)}!`}</div><button class="btn primary" id="stopLight" style="min-height:72px;font-size:22px;padding:0 34px;margin-top:28px">Stop lichtsignaal</button></div></section>`,{appbar:false,nav:false}); if('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(()=>{}); $('#stopLight').onclick=()=>{state.light=null;render();}; }
  function adminScreen(){ const cards=state.users.map(u=>`<div class="card glass between"><div class="row"><img class="avatar" src="${esc(u.profilePhotoUrl||fallbackPhoto)}"><div><b>${esc(u.name)}</b><p class="muted small" style="margin:4px 0 0">${esc(statusText(u))}</p><p class="muted small" style="margin:4px 0 0">Aangemaakt: ${esc(relTime(u.createdAt))}</p></div></div><button class="btn danger" data-remove="${u.id}">${icon('person_remove')}Verwijder</button></div>`).join(''); layout(`<div class="scroll"><h1>Admin</h1><p class="muted">Je bent ingelogd als admin. Hier kun je gebruikers uit de groep verwijderen. Later kunnen hier extra rechten bij komen.</p><div class="spacer"></div><div class="list">${cards||'<p class="muted">Er zijn nog geen gebruikers.</p>'}</div><div class="spacer"></div><button class="btn ghost full" id="adminLogout">Uitloggen als admin</button></div>`); $('#adminLogout').onclick=()=>{localStorage.clear(); state.token=''; state.user=null; state.role='user'; state.tab='map'; render();}; document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{ const user=state.users.find(u=>u.id===b.dataset.remove); if(!user) return; if(!confirm(`Weet je zeker dat je ${user.name} wilt verwijderen?`)) return; try{ await api('remove-user',{method:'POST',body:JSON.stringify({userId:user.id})}); await loadState(true); toast(`${user.name} is verwijderd.`); render(); }catch(e){toast(e.message)} }); }
  function showSignal(sig){ const from=state.users.find(u=>u.id===sig.from_user_id); if(!from) return; toast(`${from.name} zegt: ik ben hier!`); api('mark-signal-seen',{method:'POST',body:JSON.stringify({signalId:sig.id})}).catch(()=>{}); }
  setInterval(()=>loadState().then(()=>{ if(state.user && state.token && !state.light){} }).catch(()=>{}),15000);
  loadState().finally(render);
  </script>
</body>
</html>
